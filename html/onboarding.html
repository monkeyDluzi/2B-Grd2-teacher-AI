<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to 2B</title>
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/onboarding.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../images/IMG_0420.jpeg">
</head>

<body>
  <section class="onboarding-section" role="main" aria-label="Welcome setup">
    <div class="onboarding-card">
      <div class="onboarding-icon">🎓</div>
      <h1>Let's get started!</h1>
      <p>Tell me a little about yourself so I can help you learn better.</p>

      <form id="onboardingForm" class="onboarding-form" autocomplete="off">
        <label for="studentName">What's your name?</label>
        <input type="text" id="studentName" placeholder="Type your name..." required autocomplete="off" />

        <label for="studentGrade">What grade are you in?</label>
        <select id="studentGrade" required>
          <option value="" disabled selected>Select your grade</option>
          <option value="4">Grade 4</option>
          <option value="5">Grade 5</option>
          <option value="6">Grade 6</option>
          <option value="7">Grade 7</option>
        </select>

        <button type="submit" class="continue-btn">Continue to Dashboard →</button>
      </form>
    </div>
  </section>

  <script src="../js/onboarding.js"></script>
</body>
</html>
