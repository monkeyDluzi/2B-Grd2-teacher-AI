<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/static/favicon.ico" />
<title>2B Key Usage Dashboard</title>
<style>
  :root {
    --bg: #ffe9a7;
    --card: #ffffff;
    --ink: #2b1a3d;
    --pink: #ff6b9d;
    --yellow: #ffc93c;
    --green: #37c276;
    --red: #ff5a5f;
    --blue: #4d96ff;
    --shadow: 6px 6px 0 #2b1a3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Nunito", "Comic Sans MS", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 {
    font-size: 2.2rem;
    text-align: center;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    font-weight: 700;
    margin-bottom: 24px;
    opacity: 0.75;
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  button {
    font-family: inherit;
    font-weight: 800;
    font-size: 1rem;
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 12px 20px;
    background: var(--yellow);
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.06s ease, box-shadow 0.06s ease;
  }
  button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .card {
    background: var(--card);
    border: 4px solid var(--ink);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .card h2 { font-size: 1.15rem; margin-bottom: 8px; }
  .key-id { font-size: 0.85rem; font-weight: 700; color: var(--blue); margin-bottom: 12px; }
  .big {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 10px 0 6px;
  }
  .big .num { font-size: 3rem; font-weight: 900; line-height: 1; }
  .big .label { font-weight: 800; opacity: 0.7; }
  .meter {
    height: 22px;
    background: #eee;
    border: 3px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 14px;
  }
  .meter-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .ok { background: var(--green); }
  .warn { background: var(--yellow); }
  .low { background: var(--red); }
  .status {
    display: inline-block;
    font-weight: 800;
    font-size: 0.85rem;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
  }
  .status.ok-s { color: #fff; background: var(--green); }
  .status.bad-s { color: #fff; background: var(--red); }
  .status.unused-s { background: #ddd; }
  .status.quota-s { color: #fff; background: var(--orange, #ff8c42); }
  .error-box {
    margin-top: 12px;
    font-size: 0.75rem;
    font-weight: 700;
    background: #fff0f0;
    border: 2px solid var(--red);
    border-radius: 10px;
    padding: 8px;
    color: #a33;
    word-break: break-word;
  }
  .total {
    text-align: center;
    margin-top: 24px;
    font-weight: 800;
    font-size: 1.1rem;
    background: var(--card);
    border: 4px solid var(--ink);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 14px;
  }
  .note {
    text-align: center;
    margin-top: 16px;
    font-weight: 700;
    font-size: 0.85rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔋 2B Brain Energy</h1>
  <p class="subtitle">How many AI requests each Gemini key has left today</p>

  <div class="controls">
    <button id="refreshBtn" onclick="loadUsage()">🔄 Refresh</button>
    <button id="probeBtn" onclick="probeKeys()">🔍 Test the keys</button>
  </div>

  <div class="cards" id="cards">
    <p style="text-align:center; font-weight:800;">Loading…</p>
  </div>

  <div class="total" id="total">Total remaining: —</div>
  <p class="note">“Test the keys” does one tiny real request per key — it burns 1 request from that key’s daily quota.</p>
</div>

<script>
const API_URL = "/api/usage";
const PROBE_URL = "/api/check-keys";

async function loadUsage() {
  const refreshBtn = document.getElementById("refreshBtn");
  refreshBtn.disabled = true;
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    render(data);
  } catch (err) {
    document.getElementById("cards").innerHTML =
      '<p class="note" style="color:var(--red);">Could not reach the brain server.</p>';
  } finally {
    refreshBtn.disabled = false;
  }
}

async function probeKeys() {
  const probeBtn = document.getElementById("probeBtn");
  probeBtn.disabled = true;
  probeBtn.textContent = "Testing… (1 request per key)";
  try {
    const res = await fetch(PROBE_URL, { method: "POST" });
    const data = await res.json();
    render(data);
  } catch (err) {
    alert("Probe failed: " + err);
  } finally {
    probeBtn.disabled = false;
    probeBtn.textContent = "🔍 Test the keys";
  }
}

function render(data) {
  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";

  data.keys.forEach(function (k) {
    const pct = Math.max(0, Math.min(100, (k.used / k.limit) * 100));
    let fillClass = "ok";
    if (pct >= 80) fillClass = "low";
    else if (pct >= 50) fillClass = "warn";

    let statusClass = "unused-s";
    let statusText = "UNUSED";
    if (k.last_status === "ok") { statusClass = "ok-s"; statusText = "🟢 WORKING"; }
    else if (k.last_status === "quota_exceeded") { statusClass = "quota-s"; statusText = "🟠 OUT OF QUOTA"; }
    else if (k.last_status === "error") { statusClass = "bad-s"; statusText = "🔴 ERROR"; }

    const card = document.createElement("div");
    card.className = "card";

    let errorHtml = "";
    if (k.last_error) {
      errorHtml = '<div class="error-box">' + k.last_error + "</div>";
    }

    card.innerHTML =
      '<h2>Key #' + (k.index + 1) + " " + k.masked + '</h2>' +
      '<div class="key-id">Model: gemini-flash-lite-latest</div>' +
      '<div class="big"><span class="num">' + k.left + '</span><span class="label">left today</span></div>' +
      '<div class="big" style="margin-top:0;"><span class="num" style="font-size:1.6rem;color:#777;">' + k.used + '</span><span class="label" style="color:#777;">used / ' + k.limit + '</span></div>' +
      '<div class="meter"><div class="meter-fill ' + fillClass + '" style="width:' + pct + '%;"></div></div>' +
      '<div class="status ' + statusClass + '">' + statusText + "</div>" +
      errorHtml;

    cardsEl.appendChild(card);
  });

  const totalLeft = data.keys.reduce(function (sum, k) { return sum + k.left; }, 0);
  document.getElementById("total").textContent =
    "Total remaining: " + totalLeft + " of " + (data.keys.length * data.daily_limit_per_key) + " requests";
}

loadUsage();
</script>
</body>
</html>
